# Shinsekai Anime Starship Prompt
add_newline = true
command_timeout = 200
format = "[$directory]($style) [❯](bold #f43f5e)[❯](bold #38bdf8) "

[character]
error_symbol = "[✗](bold #f43f5e)"
success_symbol = "[❯](bold #38bdf8)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #38bdf8"
read_only = " 󰌾"
read_only_style = "#f43f5e"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "italic #f43f5e"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "#38bdf8"
